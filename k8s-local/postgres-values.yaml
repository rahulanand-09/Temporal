# Single PostgreSQL instance backing BOTH Temporal datastores:
#   - "temporal"            (default/execution store)
#   - "temporal_visibility" (visibility store — Advanced Visibility, native full-text search)
#
# One instance, two databases — matches what was asked for ("a postgres instance"), not two.
# The second database is created by Temporal's own schema Job (sql.createDatabase: true in
# temporal-values.yaml), not by this chart, so nothing here pre-creates it.
auth:
  enablePostgresUser: true
  existingSecret: postgres-credentials
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: postgres-password
  # POC simplification: Temporal's persistence config connects as the `postgres` superuser
  # rather than a least-privilege role. Reason: CREATE DATABASE (for temporal_visibility) and
  # CREATE EXTENSION btree_gin (for the advanced-visibility schema migration) both need
  # elevated privileges, and wiring a scoped role would mean pre-granting CREATEDB and
  # trusted-extension rights by hand before the schema Job runs. Not what you'd do for a real
  # deployment — see the doc's "Deliberate simplifications" section.

primary:
  persistence:
    enabled: true
    size: 2Gi  # StatefulSet volumeClaimTemplates are immutable post-creation -- can't resize this
               # without deleting the PVC (and its data). Not the OOM's cause anyway (that was
               # memory); revisit only if disk actually fills up.
  resources:
    # Bumped a second time, the hard way: scale-down.sh had this at 250m/256Mi (right-sized for
    # an IDLE cluster), and starting a second full 3F/4H/3M/2W topology plus a real
    # workflow-completion load test (actual event-history writes, not just parked executions)
    # against that idle-sized instance OOMKilled Postgres mid-run (12 restarts, confirmed via
    # `kubectl describe pod` -> `Last State: Terminated, Reason: OOMKilled`) -- which cascaded
    # into every pod that needed a *fresh* DB connection crash-looping (new workers, the
    # namespace-setup job) while already-connected pods (Frontend/History/Matching) kept running
    # obliviously. Lesson: re-check this file's sizing against the CURRENT combined workload
    # before starting a heavier experiment, not just after scale-up.sh's fixed topology.
    requests:
      cpu: 2
      memory: 2Gi
    limits:
      memory: 4Gi
  # 100 (Postgres's own compiled-in default) was already tight at a single 2/2/2/2 topology (33
  # in use at idle). 500 covered one diversified 3F/4H/3M/2W topology with real headroom. Bumped
  # again to 800 for running a *second* full topology alongside it (numHistoryShards A/B
  # testing) -- two 12-pod topologies' worth of connections can realistically approach 500 on
  # their own. A real deployment would reach for a connection pooler (PgBouncer) instead of
  # raising this indefinitely.
  extendedConfiguration: |
    max_connections = 800

# Single instance — no read replicas. This is a POC datastore, not a target for HA.
architecture: standalone

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
